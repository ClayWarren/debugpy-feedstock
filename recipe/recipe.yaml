schema_version: 1

context:
  name: debugpy
  version: "1.8.22"

package:
  name: debugpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e489c7268e1c7b41e13b438d9c533d2a7af73fb59bf8cd30fead8286c1c39c4e
  patches:
    - if: win
      then: 0001-include-windows-arm64-binaries.patch

build:
  number: 1

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - debugpy
        - debugpy.adapter
        - debugpy.common
        - debugpy.launcher
        - debugpy.server
  - requirements:
      run:
        - pip
    script:
      - pip check

  - if: win
    then:
      script: python test_windows_debugging.py
      files:
        recipe:
          - test_windows_debugging.py

about:
  license: MIT
  license_file:
    - LICENSE
    - ThirdPartyNotices.txt
  summary: An implementation of the Debug Adapter Protocol for Python
  homepage: https://github.com/Microsoft/debugpy
  repository: https://github.com/microsoft/debugpy

extra:
  recipe-maintainers:
    - jtilly
    - xhochy
