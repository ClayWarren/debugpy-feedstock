bot:
  automerge: true
build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
  linux_riscv64: linux_64
  osx_arm64: osx_64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: azure
  linux_ppc64le: azure
  linux_64: azure
  linux_riscv64: azure
  osx_64: azure
  osx_arm64: azure
  win_arm64: azure
  win_64: github_actions
test: native_and_emulated
